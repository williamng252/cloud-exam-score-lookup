<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tra cứu điểm thi | Domain Apps</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172b4d;font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}header{background:#123d69;color:white;padding:22px max(24px,calc((100vw - 960px)/2))}header strong{font-size:20px}header span{display:block;font-size:13px;color:#c7daed}main{max-width:760px;margin:56px auto;padding:0 20px}.tag{color:#236a93;font-size:13px;font-weight:700;letter-spacing:1px}h1{font-size:34px;line-height:1.25;margin:10px 0}p{color:#5b6b80}.panel{background:white;border:1px solid #dce4ed;border-radius:16px;padding:30px;box-shadow:0 10px 30px #152b4a09}label{display:block;font-weight:650;margin-bottom:8px}.row{display:flex;gap:12px}input{min-width:0;flex:1;border:1px solid #aebdd0;border-radius:8px;padding:13px;font:inherit;letter-spacing:2px}input:focus{outline:3px solid #b8dff4;border-color:#226e9f}button{background:#176394;color:white;border:0;border-radius:8px;padding:13px 25px;font:inherit;font-weight:650;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.hint{font-size:13px;margin-bottom:0}.message{margin-top:20px;padding:12px 15px;border-radius:8px;background:#fff0ef;color:#9f2525}.ok{color:#1b6c4b;font-size:13px;font-weight:650}.name{font-size:24px;margin:4px 0}.sub{font-size:14px;color:#607087}.result{border-top:1px solid #e0e7ef;margin-top:26px;padding-top:22px}.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.subject{background:#f2f6fa;border-radius:10px;padding:16px;text-align:center}.subject span{display:block;color:#607087;font-size:14px}.subject strong{font-size:30px;color:#174e76}footer{margin:26px 0;text-align:center;color:#758298;font-size:13px}[hidden]{display:none!important}@media(max-width:520px){main{margin-top:30px}.panel{padding:22px}.row{flex-direction:column}h1{font-size:28px}.scores{gap:7px}.subject{padding:12px 5px}}
</style></head><body>
<header><strong>DOMAIN APPS</strong><span>Hệ thống tra cứu điểm thi</span></header>
<main><div class="tag">CLOUD EXAM SCORE LOOKUP</div><h1>Tra cứu điểm thi</h1><p>Nhập số báo danh để xem kết quả của thí sinh.</p>
<section class="panel"><form id="lookup" novalidate><label for="sbd">Số báo danh</label><div class="row"><input id="sbd" name="sbd" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="Ví dụ: 01000001" aria-describedby="hint" required><button id="submit">Tra cứu</button></div><p class="hint" id="hint">Số báo danh gồm 8 chữ số. Giữ nguyên số 0 ở đầu.</p></form>
<div id="message" class="message" role="status" aria-live="polite" hidden></div>
<div id="result" class="result" hidden><div class="ok">ĐÃ TÌM THẤY KẾT QUẢ</div><h2 class="name" id="name"></h2><div class="sub">Số báo danh: <span id="number"></span></div><div class="scores"><div class="subject"><span>Toán</span><strong id="math"></strong></div><div class="subject"><span>Ngữ văn</span><strong id="literature"></strong></div><div class="subject"><span>Tiếng Anh</span><strong id="english"></strong></div></div></div>
</section><footer>Đồ án Cloud Computing · Dữ liệu điểm thi giả lập</footer></main>
<script>
const form=document.querySelector('#lookup'),button=document.querySelector('#submit'),message=document.querySelector('#message'),result=document.querySelector('#result');
form.addEventListener('submit',async event=>{event.preventDefault();result.hidden=true;message.hidden=true;const sbd=document.querySelector('#sbd').value.trim();if(!/^[0-9]{8}$/.test(sbd)){message.textContent='Vui lòng nhập đúng 8 chữ số của số báo danh.';message.hidden=false;return;}button.disabled=true;button.textContent='Đang tra cứu…';try{const response=await fetch('/api/scores?sbd='+encodeURIComponent(sbd),{cache:'no-store'});const data=await response.json();if(!response.ok)throw new Error(data.error||'Tra cứu chưa thành công.');for(const [id,key] of [['name','ho_ten'],['number','sbd'],['math','toan'],['literature','ngu_van'],['english','tieng_anh']])document.getElementById(id).textContent=data[key];result.hidden=false;}catch(error){message.textContent=error.message||'Không kết nối được hệ thống.';message.hidden=false;}finally{button.disabled=false;button.textContent='Tra cứu';}});
</script></body></html>
